server:
  port: 8080
  servlet:
    context-path: /api

spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/support_tickets}
    username: ${SPRING_DATASOURCE_USERNAME:support}
    password: ${SPRING_DATASOURCE_PASSWORD:support}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
